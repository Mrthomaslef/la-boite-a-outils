<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Boîte à Outils MSK — Mesures ostéo-articulaires</title>
  <meta name="description" content="Toutes les mesures ostéo-articulaires illustrées (radio, TDM, IRM, écho, EOS) et prothèses, par articulation — d'après le Cotten.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Boîte à Outils">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="svg.css?v=5">
  <link rel="stylesheet" href="styles.css?v=5">

<body>
  <div id="ptr" aria-hidden="true"><span>↻</span></div>
  <header class="top">
    <div class="bar">
      <button id="back" class="icon-btn" aria-label="Retour" hidden>‹</button>
      <a href="#/" class="brand"><img src="assets/icon.svg" alt="" width="30" height="30"><span id="title">Boîte à Outils MSK</span></a>
      <button id="favbtn" class="icon-btn" aria-label="Favoris">★</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Rechercher une mesure…" autocomplete="off" enterkeyhint="search"></div>
    <div class="chips" id="sections" hidden></div>
  </header>
  <main id="view"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <article class="sheet-card" id="sheet-card"></article>
  </div>
  <div id="lb" class="lb" hidden>
    <div id="lb-wrap" class="lb-wrap" data-lb><img id="lb-img" alt=""></div>
    <div class="lb-bar"><span id="lb-cap"></span><button data-lb class="lb-x" aria-label="Fermer">✕</button></div>
  </div>
  <div id="toast" role="status"></div>

  <script src="data/embedded_data.js?v=5"></script>
  <script src="app.js?v=5"></script>

</html>
